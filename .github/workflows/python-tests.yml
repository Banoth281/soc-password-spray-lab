name: Python detector tests
on:
  push:
    paths:
      - '**.py'
      - 'login_events.csv'
      - 'alerts.json'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - '**.py'
      - 'login_events.csv'
      - 'alerts.json'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Python version
        run: python --version
      - name: Run 18 standard-library tests
        run: python -m unittest -v
